name: Deploy kafka manager

on:
  push:
    branches:
     - main
    paths:
      - kafka-manager/kafka-manager-dev.yaml
      - .github/workflows/deploy-kafka-manager.yaml
  workflow_dispatch:

# Minste privilegium: toppnivået nullstiller alle token-rettigheter, hver jobb deklarerer eksplisitt det den trenger.
permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Deploy to dev
        uses: nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6 # v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: kafka-manager/kafka-manager-dev.yaml
          PRINT_PAYLOAD: true
