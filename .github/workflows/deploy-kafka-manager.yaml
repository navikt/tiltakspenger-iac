name: Deploy kafka manager

on:
  push:
    branches:
     - main
    paths:
      - kafka-manager/kafka-manager-dev.yaml
      - .github/workflows/deploy-kafka-manager.yaml
  workflow_dispatch:

# Minste privilegium: toppnivået nullstiller alle token-rettigheter, hver jobb deklarerer eksplisitt det den trenger.
permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy to dev
        uses: nais/deploy/actions/deploy@9850be311389ca754d9a9f2280615419d738c891 # v3
        env:
          CLUSTER: dev-gcp
          RESOURCE: kafka-manager/kafka-manager-dev.yaml
          PRINT_PAYLOAD: true
