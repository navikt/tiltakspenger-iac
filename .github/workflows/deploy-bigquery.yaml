name: "Terraform - Big Query"

on:
  push:
    branches:
      - main
    paths:
      - bigquery/**
      - .github/workflows/deploy-bigquery.yaml

# Minste privilegium: toppnivået nullstiller alle token-rettigheter, hver jobb deklarerer eksplisitt det den trenger.
permissions: {}

# Én gruppe for hele workflowen, slik at to kjøringer aldri planlegger og utfører om hverandre.
# Grupper per jobb gjorde ikke jobben: `terraform-plan-dev, terraform-apply-dev` er ett gruppenavn med komma i, ikke to grupper.
# cancel-in-progress er av med vilje: en avbrutt apply kan etterlate state-låsen og halvferdig arbeid.
concurrency:
  group: terraform-bigquery
  cancel-in-progress: false

env:
  DEV_DIR: './bigquery/dev'
  PROD_DIR: './bigquery/prod'
  # Terraform-versjonen er låst. Uten den installerer actionen `latest`, og en ny utgivelse kan endre prod
  # uten at noen har valgt den. 1.16.2 kom dagen før kjøringen 2026-09-10.
  # Løftes bevisst, sammen med required_version i bigquery/*/main.tf.
  TERRAFORM_VERSION: '1.16.2'

jobs:
  terraform-plan-dev:
    permissions:
      contents: read
    name: "terraform plan gcp-dev"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.DEV_DIR }}

    env:
      GOOGLE_CREDENTIALS: ${{ secrets.GCP_SECRET_DEV }}
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run 'terraform setup'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Run 'terraform init'
        run: terraform init

      - name: Run 'terraform fmt'
        run: terraform fmt -check

      - name: Run 'terraform validate'
        run: terraform validate

      - name: Run 'terraform plan'
        run: terraform plan

  terraform-plan-prod:
    permissions:
      contents: read
    name: "terraform plan gcp-prod"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROD_DIR }}

    env:
      GOOGLE_CREDENTIALS: ${{ secrets.GCP_SECRET_PROD }}
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run 'terraform setup'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Run 'terraform init'
        run: terraform init

      - name: Run 'terraform fmt'
        run: terraform fmt -check

      - name: Run 'terraform validate'
        run: terraform validate

      - name: Run 'terraform plan'
        run: terraform plan

  terraform-apply-dev:
    permissions:
      contents: read
    needs: terraform-plan-dev
    name: "terraform apply gcp-dev"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.DEV_DIR }}

    env:
      GOOGLE_CREDENTIALS: ${{ secrets.GCP_SECRET_DEV }}
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run 'terraform setup'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Run 'terraform init'
        run: terraform init

      - name: Run 'terraform apply'
        run: terraform apply -auto-approve

  terraform-apply-prod:
    permissions:
      contents: read
    # Venter også på dev-apply: en feil i dev skal stoppe prod, ikke bare rapporteres ved siden av.
    needs: [ terraform-plan-prod, terraform-apply-dev ]
    name: "terraform apply gcp-prod"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROD_DIR }}

    env:
      GOOGLE_CREDENTIALS: ${{ secrets.GCP_SECRET_PROD }}
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run 'terraform setup'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Run 'terraform init'
        run: terraform init

      - name: Run 'terraform apply'
        run: terraform apply -auto-approve