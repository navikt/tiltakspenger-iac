name: Deploy alerts

on:
  push:
    branches:
      - main
    paths:
      - alerts/**
      - .github/workflows/deploy-alerts.yaml

# Minste privilegium: toppnivået nullstiller alle token-rettigheter, hver jobb deklarerer eksplisitt det den trenger.
permissions: {}

jobs:
  deploy-dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cluster: [ dev-gcp, dev-fss ]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6 # v2
        env:
          CLUSTER: ${{ matrix.cluster }}
          RESOURCE: alerts/felles-alerts.yaml
          VAR: datasource=dev-gcp-loki
          VARS: alerts/.nais/vars.yaml
          PRINT_PAYLOAD: true

  deploy-prod:
    name: Deploy to prod
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cluster: [ prod-gcp, prod-fss ]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6 # v2
        env:
          CLUSTER: ${{ matrix.cluster }}
          RESOURCE: alerts/felles-alerts.yaml
          VAR: datasource=prod-gcp-loki
          VARS: alerts/.nais/vars.yaml
          PRINT_PAYLOAD: true
