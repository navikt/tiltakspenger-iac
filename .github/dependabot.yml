# Standard Dependabot-konfig for repo uten kodeavhengigheter Dependabot skal følge (iac, pdfgen; metarepoet bruker denne).
# Holder actions ferske; Dependabot oppdaterer tag-en i workflowen og låsen i .github/workflows/actions.lock i samme PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      # Navs egne pakker tas med én gang; cooldownen gjelder tredjepart.
      exclude:
        - "nais/*"
        - "navikt/*"
