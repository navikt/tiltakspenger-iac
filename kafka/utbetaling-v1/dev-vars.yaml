pool: nav-dev
config:
    cleanupPolicy: delete
    minimumInSyncReplicas: 2
    partitions: 1 # én producer og lite volum, og gir rekkefølge for alle meldinger
    replication: 3 # tåler at én broker er nede uten at skrivingen med acks=all stopper
    retentionBytes: -1
    retentionHours: -1 # evig; utbetalingsdata skal kunne leses på nytt
