apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tiltakspenger-felles-alerts
  namespace: {{namespace}}
  labels:
    team: {{team}}
spec:
  groups:
    - name: tiltakspenger-felles-alerts
      rules:
        - alert: Applikasjon er nede
          expr: sum by (deployment) (kube_deployment_status_replicas_available{namespace="{{namespace}}"}) == 0
          for: 5m
          annotations:
            consequence: '\{{ $labels.deployment }} har utilgjengelige podder'
            action: '`kubectl describe pod -l app=\{{ $labels.deployment }} -n \{{ $labels.namespace }}` for events og `kubectl get  pods -l app=\{{ $labels.deployment }} -n \{{ $labels.namespace }}` for å se feilende podder'
          labels:
            namespace: {{namespace}}
            severity: critical
        - alert: Høy feilrate i logger (> 5 feil siste timen og > 0 feil siste 15 min)
          expr: max(sum_over_time(loki:service:loglevel:count1m{detected_level="error", service_namespace="{{namespace}}", k8s_container_name=~"tiltakspenger-.*"}[1h])) by (service_name) > 5 and max(sum_over_time(loki:service:loglevel:count1m{detected_level="error", service_namespace="{{namespace}}", k8s_container_name=~"tiltakspenger-.*"}[15m])) by (service_name) > 0
          annotations:
            action: "Sjekk loggene til appen \{{ $labels.service_name }} for å se hvorfor det er så mye feil"
            dashboard_url: 'https://grafana.nav.cloud.nais.io/a/grafana-lokiexplore-app/explore/service/\{{ $labels.service_name }}/logs?var-filters=service_name%7C%3D%7C\{{ $labels.service_name }}&var-filters=service_namespace%7C%3D%7C{{namespace}}&from=now-3h&to=now&var-levels=detected_level%7C%3D%7Cerror&var-ds={{datasource}}'
          labels:
            namespace: {{namespace}}
            severity: critical
            datasource: {{datasource}}
        - alert: Kafka consumer offset lag
          expr: sum by(group, topic) (kafka_consumergroup_group_topic_sum_lag{group=~"^tiltakspenger-.*",client_id!="unknown"}) > 30
          for: 15m
          annotations:
            action: 'Konsument \{{ $labels.group }} har forsinkelse på lesing fra kafkatopic \{{ $labels.topic }}. Sjekk loggene for å finne ut hvorfor.'
          labels:
            namespace: {{namespace}}
            severity: warning
        - alert: Jobb har stoppet
          expr: time() - max by (app, prosess, type) (tpts_bakgrunnsprosess_sist_vellykket_tidspunkt_sekunder{namespace="{{namespace}}", type="jobb"}) > clamp_min(3 * max by (app, prosess, type) (tpts_bakgrunnsprosess_intervall_sekunder{namespace="{{namespace}}", type="jobb"}), 600)
          for: 10m
          annotations:
            consequence: 'Jobben \{{ $labels.prosess }} i \{{ $labels.app }} har sluttet å kjøre'
            action: 'Sjekk om poden lever, om leader-election henger, og om loggene viser at jobben har stoppet.'
          labels:
            namespace: {{namespace}}
            severity: warning
        - alert: Meldingsleser har stoppet
          expr: time() - max by (app, prosess, type, pod) (tpts_bakgrunnsprosess_sist_vellykket_tidspunkt_sekunder{namespace="{{namespace}}", type="meldingsleser"}) > clamp_min(3 * max by (app, prosess, type, pod) (tpts_bakgrunnsprosess_intervall_sekunder{namespace="{{namespace}}", type="meldingsleser"}), 600)
          for: 10m
          annotations:
            consequence: 'Meldingsleseren \{{ $labels.prosess }} i poden \{{ $labels.pod }} for \{{ $labels.app }} har sluttet å kjøre'
            action: 'Sjekk loggene for poden \{{ $labels.pod }} og om consumeren har stoppet å polle.'
          labels:
            namespace: {{namespace}}
            severity: warning
        # Vakt for de to reglene over: forsvinner målingene helt, får uttrykkene deres ingen serier å regne på, og appen blir stille i stedet for rød.
        # Begge målingene sjekkes, fordi begge reglene bruker begge. Utvid applista når en ny app får jobber eller meldingslesere.
        - alert: Bakgrunnsprosesser mangler målinger
          expr: group by (app) (up{namespace="{{namespace}}", app=~"tiltakspenger-(saksbehandling-api|journalposthendelser|datadeling|meldekort-api|soknad-api)"} == 1) unless on (app) (group by (app) (tpts_bakgrunnsprosess_intervall_sekunder{namespace="{{namespace}}"}) and on (app) group by (app) (tpts_bakgrunnsprosess_sist_vellykket_tidspunkt_sekunder{namespace="{{namespace}}"}))
          for: 15m
          annotations:
            consequence: 'Vi blir ikke varslet hvis bakgrunnsprosessene i \{{ $labels.app }} stopper'
            action: 'Sjekk siste utrulling av \{{ $labels.app }}. Kontroller at appen bruker et bibliotek med målingene, og at bakgrunnsprosessene fører dem i det registeret `/metrics` skraper.'
          labels:
            namespace: {{namespace}}
            severity: warning
        # Etterlevelseskrav K267.2 (Informasjonssikkerhet, suksesskriterie 2): apper skal bygges og deployes minst
        # hver tredje måned, slik at deploy-veien er kjent god den dagen en sårbarhet må rettes raskt.
        # Vi varsler etter 75 dager for å ha tid igjen før fristen på 90.
        # Alderen leses av nyeste ReplicaSet: hver deploy med nytt image gir et nytt ReplicaSet, mens omstart,
        # node-flytting og skalering gjenbruker det gamle. En plattform-endring i pod-malen kan nullstille alderen
        # uten at vi har bygget selv, så regelen kan komme til å tie for lenge — den kan ikke varsle for tidlig.
        # Apper som er slettet har ingen serier og varsles ikke; repoer uten Nais-app (libs, workflows, iac) dekkes ikke her.
        - alert: Appen er ikke deployet på over 75 dager
          expr: (time() - max by (app) (label_replace(kube_replicaset_created{namespace="{{namespace}}"} * on (namespace, replicaset) group_left(owner_name) kube_replicaset_owner{namespace="{{namespace}}", owner_kind="Deployment"}, "app", "$1", "owner_name", "(.*)"))) > 75 * 24 * 3600
          for: 1h
          annotations:
            consequence: '\{{ $labels.app }} nærmer seg brudd på etterlevelseskrav K267.2: bygg og deploy minst hver tredje måned. Vi vet ikke om deploy-veien fortsatt virker, og tredjepartskoden i imaget blir liggende uoppdatert.'
            action: 'Oppdater avhengighetene i repoet til \{{ $labels.app }} og merge til main slik at appen bygges og deployes på nytt. Er appen ikke lenger i bruk, fjern den i stedet.'
          labels:
            namespace: {{namespace}}
            severity: warning
